<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f5ee">
<meta name="description" content="어른뭉방구 게임 메뉴">
<title>어른뭉방구 · 게임 메뉴</title>
<link href="/src/menu.css" rel="stylesheet">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
</head>
<body>
<main class="game-menu" aria-labelledby="menu-title">
  <header class="menu-brand">
    <img src="/design/logo/logo.svg" alt="어른뭉방구" width="306" height="267">
    <h1 id="menu-title" class="sr-only">게임 선택</h1>
  </header>
  <nav class="menu-options" aria-label="게임 선택">
    <a class="menu-option" href="./card.html" aria-labelledby="card-title">
      <div class="game-thumbnail carousel-thumbnail">
        <img src="/src/ui/menu/card-carousel.webp" alt="" width="2876" height="1624" decoding="async">
      </div>
      <div class="game-caption">
        <span class="game-name" id="card-title">카드뽑기</span>
        <svg class="menu-arrow" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M5 16h21m-7-7 7 7-7 7"/></svg>
      </div>
    </a>
    <a class="menu-option" href="./pinball/index.html" aria-labelledby="pinball-title">
      <div class="game-thumbnail pinball-thumbnail">
        <img src="/src/ui/menu/pinball-gameplay.webp" alt="" width="1920" height="1080" decoding="async">
      </div>
      <div class="game-caption">
        <span class="game-name" id="pinball-title">Pinball</span>
        <svg class="menu-arrow" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M5 16h21m-7-7 7 7-7 7"/></svg>
      </div>
    </a>
    <a class="menu-option" href="./coin.html" aria-labelledby="coin-title">
      <div class="game-thumbnail coin-thumbnail">
        <img src="/src/ui/menu/coin-flip.webp" alt="" width="960" height="640" decoding="async">
      </div>
      <div class="game-caption">
        <span class="game-name" id="coin-title">코인 플립</span>
        <svg class="menu-arrow" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M5 16h21m-7-7 7 7-7 7"/></svg>
      </div>
    </a>
  </nav>
</main>
<!-- 전체화면 (지원하는 브라우저에서만 fullscreen.js가 보이게 한다) -->
<button id="fullscreen-toggle" class="fullscreen-toggle" type="button" aria-label="전체화면 켜기" aria-pressed="false" hidden>
  <svg class="icon-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
  <svg class="icon-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>
</button>
<script type="module" src="/fullscreen.js"></script>
</body>
</html>
