<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1511">
<title>어른뭉방구 스페셜 카드팩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
</head>
<body>
<canvas id="stage"></canvas>
<!-- 최고등급 카드 등장 시 화면 플래시 (명세 R9) -->
<div id="flash" class="flash" aria-hidden="true"></div>

<!-- [0] 인트로: 사운드 잠금 해제용 첫 터치 (명세 2장) -->
<div id="intro" class="intro is-loading" role="button" tabindex="0" aria-label="터치해서 시작">
  <img class="intro-logo" src="/logo.svg" alt="어른뭉방구" width="306" height="267">
  <p class="intro-eyebrow">EOREUN MUNGBANGGU · SPECIAL CARD PACK</p>
  <h1 class="intro-title">스페셜 카드팩</h1>
  <p class="intro-cta">
    <span class="when-loading">카드팩을 준비하고 있어요</span>
    <span class="when-ready">화면을 터치해서 시작</span>
    <span class="when-error">불러오지 못했어요. 새로고침해 주세요.</span>
  </p>
</div>

<!-- 조작 안내 (절취·뒤집기) -->
<div id="hint" class="hint" aria-live="polite">
  <p class="hint-main"></p>
  <p class="hint-sub"></p>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
